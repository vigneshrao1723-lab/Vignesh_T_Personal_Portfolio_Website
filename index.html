<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("vignesh-portfolio-theme");
        } catch {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta
      name="description"
      content="Vignesh T's portfolio of work across networking, applied cryptography, AI engineering, and full-stack technical systems."
    />
    <title>Vignesh T</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
